
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>علی ایکس استار | چت</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;font-family:Tahoma,Arial,sans-serif;
  background:linear-gradient(135deg,#10152f,#34205c,#075e65);
  color:white;min-height:100vh;padding:18px;
  display:flex;justify-content:center;align-items:center
}
.app{
  width:100%;max-width:500px;padding:20px;
  border-radius:22px;background:#ffffff12;
  border:1px solid #ffffff30;backdrop-filter:blur(10px);
  box-shadow:0 15px 45px #0004
}
h1{text-align:center;color:#8fffe0}
p{text-align:center;color:#ddd}
#messages{
  height:300px;overflow:auto;background:#0003;
  border-radius:14px;padding:12px;margin:15px 0
}
.msg{
  padding:10px;margin-bottom:8px;border-radius:12px;
  background:#ffffff16;overflow-wrap:anywhere
}
.name{color:#8fffe0;font-weight:bold}
input,button{
  width:100%;padding:13px;margin-top:8px;
  border:0;border-radius:11px;font:inherit
}
input{background:#fff;color:#222}
button{
  background:linear-gradient(90deg,#00d9b5,#8d70ff);
  color:#111;font-weight:bold;cursor:pointer
}
.note{font-size:12px;color:#ccc}
</style>
</head>
<body>
<div class="app">
  <h1>🎮 علی ایکس استار</h1>
  <p>به چت دوستانه خوش آمدی 💬</p>
  <input id="name" maxlength="25" placeholder="نام خودت را بنویس">
  <div id="messages"></div>
  <form id="form">
    <input id="text" maxlength="300" placeholder="پیامت را بنویس..." required>
    <button type="submit">ارسال پیام 🚀</button>
  </form>
  <p class="note">این نسخه نمایشی است؛ پیام‌ها فقط در همین صفحه و همین دستگاه می‌مانند.</p>
</div>
<script>
const nameBox=document.getElementById('name');
const textBox=document.getElementById('text');
const messages=document.getElementById('messages');
nameBox.value=localStorage.getItem('axs_name')||'';

document.getElementById('form').addEventListener('submit',function(e){
  e.preventDefault();
  const name=nameBox.value.trim();
  const text=textBox.value.trim();
  if(!name||!text){
    alert('نام و پیام را بنویس!');
    return;
  }
  localStorage.setItem('axs_name',name);
  const item=document.createElement('div');
  item.className='msg';
  const title=document.createElement('div');
  title.className='name';
  title.textContent=name;
  const body=document.createElement('div');
  body.textContent=text;
  item.append(title,body);
  messages.appendChild(item);
  messages.scrollTop=messages.scrollHeight;
  textBox.value='';
});
</script>
</body>
</html>
